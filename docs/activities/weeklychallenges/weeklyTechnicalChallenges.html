<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS - Weekly Technical Challenge</title>
    <link rel="stylesheet" href="../../styles/weeklyTechnicalChallenge.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#ffffff",
              accent: "#139a43",
              dark: "#000000",
              light: "#e0e0e0",
              lighter: "#a0a0a0",
              card: "#1e1e1e",
            },
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
            },
            animation: {
              "fade-in-up": "fadeInUp 0.6s ease forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <section id="hero">
      <!-- Member 1 -->
    </section>

    <section id="domains">
      <!-- Member 2 -->
    </section>

    <section class="info-section">
      <div class="how-it-works">
        <!-- How It Works content -->
      </div>

      <div class="points-system">
        <!-- Points System content -->
      </div>
    </section>

    <section class="leaderboard-banner">
      <div class="leaderboard-icon">
        <!-- Trophy Icon -->
      </div>

      <div class="leaderboard-content"></div>
    </section>

    <section id="faq">
      <!-- Member 3 -->
    </section>

    <footer>
      <!-- Member 4 -->
    </footer>
    <div id="footer-placeholder"></div>

    <!-- Component loaders -->
    <script src="/components/navbar.js"></script>
    <script src="/components/footer.js"></script>
  </body>
</html>
