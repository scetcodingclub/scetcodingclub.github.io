<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Coding Club - SCET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- <link rel="stylesheet" href="/styles/tailwind.css"> -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ffffff',
            accent: '#139a43',
            dark: '#000000',
            light: '#e0e0e0',
            lighter: '#a0a0a0',
            card: '#1e1e1e',
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.6s ease forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        }
      }
    }
  </script>

</head>

<body class="bg-dark text-light font-sans min-h-screen">

  <!-- Navigation -->
  <div id="navbar-placeholder"></div>

  <div class="pt-20"></div>

  <!-- Hero Section -->
  <section class="relative h-screen flex items-center justify-center overflow-hidden">
    <!-- Enhanced Background Design -->
    <div class="absolute inset-0 bg-gradient-to-br from-dark via-card to-dark"></div>
    <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-accent/5 to-transparent"></div>
    
    <!-- Animated Background Pattern -->
    <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23139a43" fill-opacity="0.1"%3E%3Ccircle cx="40" cy="40" r="1.5"/%3E%3Ccircle cx="20" cy="20" r="1"/%3E%3Ccircle cx="60" cy="60" r="1"/%3E%3Ccircle cx="20" cy="60" r="1"/%3E%3Ccircle cx="60" cy="20" r="1"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')] opacity-40 animate-pulse"></div>
    
    <!-- Content -->
    <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto flex flex-col justify-center items-center h-full">
      <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold text-primary mb-6 leading-tight animate-fade-in-up">
        Let's Build What Others Dream
      </h1>
      <h3 class="text-lg sm:text-xl md:text-2xl lg:text-3xl text-light font-medium mb-12 leading-relaxed animate-fade-in-up" style="animation-delay: 0.2s;">
        Let's connect, collaborate and code, Join the Journey!
      </h3>
      
      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 sm:gap-6 justify-center items-center mb-12 animate-fade-in-up" style="animation-delay: 0.4s;">
        <button class="bg-accent hover:bg-accent/90 text-primary font-semibold px-8 py-4 rounded-full text-lg transition-all duration-300 transform hover:scale-105 hover:shadow-lg hover:shadow-accent/25 min-w-[200px]">
          Join Now
        </button>
        <button class="border-2 border-accent text-accent hover:bg-accent hover:text-primary font-semibold px-8 py-4 rounded-full text-lg transition-all duration-300 transform hover:scale-105 min-w-[200px]">
          Learn More
        </button>
      </div>
      
      <!-- Animated Scroll Indicator -->
      <div class="flex flex-col items-center animate-fade-in-up mt-2" style="animation-delay: 0.6s;">
        <!-- Mouse Icon -->
        <div class="mb-4">
          <svg class="w-8 h-12 sm:w-10 sm:h-14 md:w-12 md:h-16 lg:w-10 lg:h-14 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C8 2 6 4 6 8v8c0 4 2 6 6 6s6-2 6-6V8c0-4-2-6-6-6z"/>
            <circle cx="12" cy="8" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        
        <!-- Cascading Chevron Arrows -->
        <div class="flex flex-col items-center space-y-1">
          <svg class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 lg:w-9 lg:h-9 text-accent animate-bounce" style="animation-duration: 1.5s; animation-delay: 0s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
          <svg class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 lg:w-9 lg:h-9 text-accent animate-bounce" style="animation-duration: 1.5s; animation-delay: 0.3s; opacity: 0.6;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
          <svg class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 lg:w-9 lg:h-9 text-accent animate-bounce" style="animation-duration: 1.5s; animation-delay: 0.6s; opacity: 0.3;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>
    </div>
    
    <!-- Enhanced Background Orbs & Glow -->
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(19,154,67,0.12)_0%,rgba(0,0,0,0)_45%)]"></div>
    <div class="pointer-events-none absolute -top-10 -left-10 w-40 h-40 rounded-full bg-accent/10 blur-2xl animate-pulse"></div>
    <div class="pointer-events-none absolute bottom-10 right-10 w-32 h-32 rounded-full bg-accent/10 blur-2xl animate-pulse" style="animation-delay:.6s"></div>
    <div class="pointer-events-none absolute top-1/4 right-1/4 w-24 h-24 rounded-full bg-accent/10 blur-xl animate-ping" style="animation-duration:3s"></div>
    
  </section>

  <!-- Focus Typing Section -->
  <section class="relative w-full min-h-screen flex flex-col items-center justify-start pt-24 md:pt-32 bg-gradient-to-b from-dark via-card/70 to-dark">
    <div class="absolute inset-0 pointer-events-none bg-accent/5"></div>
    <div class="relative z-10 px-4">
      <h2 class="text-4xl md:text-5xl font-bold text-center text-primary">
        <span id="focus-typer-prefix"></span><span id="focus-typer-highlight" class="text-accent"></span><span class="align-middle inline-block w-1 h-7 md:h-8 bg-accent ml-1 animate-pulse"></span>
      </h2>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script>
    // Smooth typing/erasing loop for: “What’s your ” + green “focus?”
    (function () {
      const prefix = "What’s your ";
      const highlight = "focus?";
      const elPrefix = document.getElementById('focus-typer-prefix');
      const elHighlight = document.getElementById('focus-typer-highlight');
      if (!elPrefix || !elHighlight) return;

      let p = 0; // index for prefix
      let h = 0; // index for highlight
      let phase = 'typePrefix';

      function tick() {
        switch (phase) {
          case 'typePrefix': {
            elPrefix.textContent = prefix.slice(0, ++p);
            if (p === prefix.length) { phase = 'typeHighlight'; setTimeout(tick, 120); } else { setTimeout(tick, 80); }
            break;
          }
          case 'typeHighlight': {
            elHighlight.textContent = highlight.slice(0, ++h);
            if (h === highlight.length) { phase = 'pauseFull'; setTimeout(tick, 1200); } else { setTimeout(tick, 80); }
            break;
          }
          case 'pauseFull': {
            phase = 'eraseHighlight';
            setTimeout(tick, 60);
            break;
          }
          case 'eraseHighlight': {
            elHighlight.textContent = highlight.slice(0, --h);
            if (h === 0) { phase = 'erasePrefix'; setTimeout(tick, 60); } else { setTimeout(tick, 40); }
            break;
          }
          case 'erasePrefix': {
            elPrefix.textContent = prefix.slice(0, --p);
            if (p === 0) { phase = 'typePrefix'; setTimeout(tick, 500); } else { setTimeout(tick, 40); }
            break;
          }
        }
      }

      tick();
    })();
  </script>
</body>

</html>
